           Q 44 16 38 16
           L 26 16
           Q 16 16 16 26
           L 16 38
           Q 16 48 26 48
           L 38 48
           Q 44 48 44 42
           L 44 32
           L 32 32"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Accent dot — point de bascule -->
