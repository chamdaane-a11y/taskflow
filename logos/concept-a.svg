<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="a-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A3E"/>
      <stop offset="100%" stop-color="#B8521C"/>
    </linearGradient>
    <linearGradient id="a-hl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#a-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#a-hl)"/>

  <!-- G ouvert avec sa branche horizontale décalée (shift) -->
