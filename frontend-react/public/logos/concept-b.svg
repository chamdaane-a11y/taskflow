<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="b-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0884A"/>
      <stop offset="100%" stop-color="#B8521C"/>
    </linearGradient>
  </defs>

  <!-- Fond doux -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1F2326"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#383D42" stroke-width="1"/>

  <!-- Plaque arrière (outline ember) — état d'origine -->
  <rect x="13" y="22" width="26" height="26" rx="6"
        fill="none" stroke="#E07A3E" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Plaque avant (filled ember) — état déplacé -->
  <rect x="25" y="14" width="26" height="26" rx="6" fill="url(#b-grad)"/>

  <!-- Flèche fine de déplacement entre les deux -->
  <path d="M 22 30 L 30 22" stroke="#E07A3E" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 28 22 L 30 22 L 30 24" stroke="#E07A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7" fill="none"/>
</svg>
