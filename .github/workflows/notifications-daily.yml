name: Notifications quotidiennes

# 3 ticks par jour pour le système de notifs Notion-style
# Matin ~6h37 UTC (7h37 Paris hiver / 8h37 été)
# Midi  ~11h11 UTC (12h Paris hiver / 13h été)
# Soir  ~18h23 UTC (19h Paris hiver / 20h été)
#
# IMPORTANT : minutes décalées hors du ':00' pile — les crons à l'heure ronde
# sont le créneau le plus saturé chez GitHub, donc les plus souvent retardés
# voire droppés. Et le moment est dérivé du cron déclencheur (github.event.schedule),
# PAS de l'horloge du run : ainsi un tick matin retardé exécute quand même le job
# matin au lieu d'être requalifié en midi.
on:
  schedule:
    - cron: '37 6 * * *'   # matin
    - cron: '11 11 * * *'  # midi
    - cron: '23 18 * * *'  # soir
  workflow_dispatch:
    inputs:
      moment:
        description: 'Quel tick déclencher manuellement'
        required: true
        default: 'matin'
        type: choice
        options: [matin, midi, soir, lifecycle, all]

jobs:
  notifications-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Détecter le moment de la journée
        id: heure
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "moment=${{ github.event.inputs.moment }}" >> $GITHUB_OUTPUT
          else
            # Moment dérivé du cron déclencheur, pas de l'heure réelle du run.
            # Un run retardé garde donc son identité (matin reste matin).
            case "$SCHEDULE" in
              "37 6 * * *")  echo "moment=matin" >> $GITHUB_OUTPUT ;;
              "11 11 * * *") echo "moment=midi"  >> $GITHUB_OUTPUT ;;
              "23 18 * * *") echo "moment=soir"  >> $GITHUB_OUTPUT ;;
              *)
                # Filet de sécurité si un cron change sans MAJ de ce case : on
                # retombe sur l'heure du run plutôt que de ne rien envoyer.
                H=$(date -u +%H)
                if [ "$H" -lt 10 ]; then echo "moment=matin" >> $GITHUB_OUTPUT
                elif [ "$H" -lt 15 ]; then echo "moment=midi" >> $GITHUB_OUTPUT
                else echo "moment=soir" >> $GITHUB_OUTPUT
                fi
                ;;
            esac
          fi

      - name: Wake up Render backend
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 30 https://getshift-backend.onrender.com/health; then
              echo "✓ Backend awake try $i"; break
            fi
            sleep 20
          done

      - name: Wait for warm-up
        run: sleep 12

      - name: Déclencher lifecycle (tous les ticks)
        if: steps.heure.outputs.moment == 'matin' || steps.heure.outputs.moment == 'lifecycle' || steps.heure.outputs.moment == 'all'
        run: |
          echo "→ Lifecycle (onboarding Day N)"
          curl -sf -X POST  -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" --max-time 60 https://getshift-backend.onrender.com/notifications/lifecycle-tick || echo "fail lifecycle"

      - name: Déclencher daily matin
        if: steps.heure.outputs.moment == 'matin' || steps.heure.outputs.moment == 'all'
        run: |
          echo "→ Daily matin"
          curl -sf -X POST  -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" --max-time 60 https://getshift-backend.onrender.com/notifications/daily-matin || echo "fail matin"

      - name: Déclencher daily midi
        if: steps.heure.outputs.moment == 'midi' || steps.heure.outputs.moment == 'all'
        run: |
          echo "→ Daily midi"
          curl -sf -X POST  -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" --max-time 60 https://getshift-backend.onrender.com/notifications/daily-midi || echo "fail midi"

      - name: Déclencher daily soir (streak warning + winback)
        if: steps.heure.outputs.moment == 'soir' || steps.heure.outputs.moment == 'all'
        run: |
          echo "→ Daily soir (streak warning + winback)"
          curl -sf -X POST  -H "Authorization: Bearer ${{ secrets.JOB_SECRET }}" --max-time 60 https://getshift-backend.onrender.com/notifications/daily-soir || echo "fail soir"
