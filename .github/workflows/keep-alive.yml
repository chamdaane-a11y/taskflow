name: Keep Render backend alive

on:
  schedule:
    # Toutes les 14 minutes — en dessous du timeout Render (15 min d'inactivité)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://getshift-backend.onrender.com/health)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Backend responded with $STATUS"
            exit 1
          fi
          echo "✅ Backend alive"
