name: Keep Render backend alive

on:
  schedule:
    # Toutes les 14 minutes — en dessous du timeout Render (15 min d'inactivité)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend /health
        run: |
          OK=0
          for i in 1 2 3 4 5; do
            BODY=$(curl -s --max-time 45 https://getshift-backend.onrender.com/health || true)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://getshift-backend.onrender.com/health || echo "000")
            echo "Try $i — Status: $STATUS — $BODY"
            if [ "$STATUS" = "200" ]; then OK=1; break; fi
            sleep 20
          done
          if [ "$OK" != "1" ]; then
            echo "⚠️ Backend not healthy after retries"
            exit 1
          fi
          echo "✅ Backend alive"
