  <!-- ═══════════════════════════════════════════════════════════
       GitHub Pages SPA fix — synchronisé avec 404.html
       Ton 404.html encode : ?p=/dashboard&q=...
       Ce script restaure : /taskflow/dashboard
  ═══════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var BASE = '/taskflow';
      var search = window.location.search;
      if (!search) return;

      var params = {};
      search.slice(1).split('&').forEach(function (pair) {
        var idx = pair.indexOf('=');
        if (idx === -1) return;
        var key = decodeURIComponent(pair.slice(0, idx));
        var val = decodeURIComponent(pair.slice(idx + 1)).replace(/~and~/g, '&');
        params[key] = val;
      });

      if (params.p !== undefined) {
        // params.p vaut ex: "/dashboard" ou "dashboard"
        // On s'assure qu'il commence par /
        var path = params.p;
        if (path && path[0] !== '/') path = '/' + path;

        var query = params.q ? '?' + params.q.replace(/~and~/g, '&') : '';
        var hash = window.location.hash;

        // Reconstruit l'URL complète avec le base /taskflow
        var newUrl = BASE + path + query + hash;
        window.history.replaceState(null, null, newUrl);
      }
    })();
  </script>
