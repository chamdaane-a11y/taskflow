<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gs-ember-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A3E"/>
      <stop offset="100%" stop-color="#B8521C"/>
    </linearGradient>
    <linearGradient id="gs-ember-hl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gs-ember-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gs-ember-hl)"/>

  <!-- Plaque arrière : outline blanc 60% opacité, position bottom-left -->
  <rect x="14" y="26" width="24" height="24" rx="5"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Plaque avant : blanc plein, position top-right (offset diagonal de 12px) -->
  <rect x="26" y="14" width="24" height="24" rx="5" fill="#FFFFFF"/>
</svg>
